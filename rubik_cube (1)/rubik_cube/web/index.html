<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Cubo de Rubik 3D</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header>
    <h1>Cubo de Rubik — vista 3D</h1>
    <span id="status" class="pending">desordenado</span>
  </header>

  <main>
    <div id="scene-wrapper">
      <canvas id="scene"></canvas>
    </div>

    <aside id="controls">
      <h2>Desordenar / Armar</h2>
      <div class="row" style="margin-bottom:8px;">
        <input type="number" id="scramble-count" value="20" min="1" max="100" />
        <button id="btn-scramble" class="action-btn">Desordenar</button>
      </div>
      <button id="btn-solve" class="action-btn">Armar (deshacer historial)</button>
      <button id="btn-reset" class="action-btn">Reiniciar cubo resuelto</button>
      <div style="font-size:12px; color:#9a9ba5; margin-bottom:6px;">
        Movimientos en historial: <span id="history-count">0</span>
      </div>

      <h2>Movimientos manuales</h2>
      <input id="manual-input" placeholder="ej: R U R' U'" />
      <button id="btn-run-manual" class="action-btn">Ejecutar secuencia</button>

      <h2>Caras</h2>
      <div class="face-block">
        <div class="face-label">U (arriba)</div>
        <div class="move-grid">
          <button data-move="U">U</button><button data-move="U'">U'</button><button data-move="U2">U2</button>
        </div>
      </div>
      <div class="face-block">
        <div class="face-label">D (abajo)</div>
        <div class="move-grid">
          <button data-move="D">D</button><button data-move="D'">D'</button><button data-move="D2">D2</button>
        </div>
      </div>
      <div class="face-block">
        <div class="face-label">L (izquierda)</div>
        <div class="move-grid">
          <button data-move="L">L</button><button data-move="L'">L'</button><button data-move="L2">L2</button>
        </div>
      </div>
      <div class="face-block">
        <div class="face-label">R (derecha)</div>
        <div class="move-grid">
          <button data-move="R">R</button><button data-move="R'">R'</button><button data-move="R2">R2</button>
        </div>
      </div>
      <div class="face-block">
        <div class="face-label">F (frente)</div>
        <div class="move-grid">
          <button data-move="F">F</button><button data-move="F'">F'</button><button data-move="F2">F2</button>
        </div>
      </div>
      <div class="face-block">
        <div class="face-label">B (atras)</div>
        <div class="move-grid">
          <button data-move="B">B</button><button data-move="B'">B'</button><button data-move="B2">B2</button>
        </div>
      </div>
    </aside>
  </main>

  <footer>Click + arrastrar para rotar la camara · scroll para zoom</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
